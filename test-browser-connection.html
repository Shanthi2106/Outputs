<!DOCTYPE html>
<html>
<head>
    <title>Backend Connection Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Backend Connection Test</h1>
    <div id="results"></div>
    
    <script>
        const resultsDiv = document.getElementById('results');
        
        async function testConnection() {
            resultsDiv.innerHTML = '<p class="info">Testing connection...</p>';
            
            const apiUrl = 'http://localhost:3004/api/v1/health';
            
            try {
                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                });
                
                if (response.ok) {
                    const data = await response.json();
                    resultsDiv.innerHTML = `
                        <h2 class="success">✓ Connection Successful!</h2>
                        <p><strong>Status:</strong> ${response.status} ${response.statusText}</p>
                        <p><strong>URL:</strong> ${apiUrl}</p>
                        <h3>Response:</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                        <h3>CORS Headers:</h3>
                        <pre>Access-Control-Allow-Origin: ${response.headers.get('access-control-allow-origin') || 'Not set'}</pre>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <h2 class="error">✗ Connection Failed</h2>
                        <p><strong>Status:</strong> ${response.status} ${response.statusText}</p>
                        <p><strong>URL:</strong> ${apiUrl}</p>
                        <p>Response: ${await response.text()}</p>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `
                    <h2 class="error">✗ Connection Error</h2>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p><strong>URL:</strong> ${apiUrl}</p>
                    <h3>Possible Issues:</h3>
                    <ul>
                        <li>Backend server not running on port 3004</li>
                        <li>CORS not configured correctly</li>
                        <li>Firewall blocking the connection</li>
                        <li>Network issue</li>
                    </ul>
                    <h3>Error Details:</h3>
                    <pre>${error.stack || error}</pre>
                `;
            }
        }
        
        // Test on page load
        testConnection();
        
        // Add button to retry
        const button = document.createElement('button');
        button.textContent = 'Retry Test';
        button.onclick = testConnection;
        button.style.cssText = 'margin-top: 20px; padding: 10px 20px; font-size: 16px; cursor: pointer;';
        document.body.appendChild(button);
    </script>
</body>
</html>
